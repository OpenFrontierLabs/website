openapi: 3.1.1
info:
  title: Open Frontier Labs website
  version: 0.1.0
  description: >-
    Browser routes served by the Worker (server-rendered HTML forms, no JSON API). Session is a
    signed HttpOnly cookie set by the GitHub OAuth callback; POSTs must be same-origin (Sec-Fetch-Site: same-origin, or this site's Origin when that header is absent).
    Pages, not a programmatic API, so paths are unversioned (declared in api-schema-gate.json).
servers:
  - url: https://openfrontier-labs.com
paths:
  /:
    get:
      summary: Home page (static asset) with the live waitlist count
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
  /dashboard:
    get:
      summary: Network dashboard (static asset). The swarm blocks (nodes online, runs, devices by type, latest run with its validation-loss chart, participants and weights hash) are filled from D1 on each view; without swarm data the static zeros stand.
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
  /v1/swarm:
    get:
      summary: Public swarm summary as JSON; nodes online (heartbeat within the last online_window_seconds), registered nodes, devices by type, run, round and compute totals, and the latest run with its rounds
      responses:
        "200":
          description: Summary
          headers: { Cache-Control: { schema: { type: string }, description: "public, max-age=5" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwarmSummary" }
  /v1/swarm/ingest:
    post:
      summary: Coordinator report. Idempotent upserts of nodes, one run and up to 10 rounds; a heartbeat is a report with only nodes. Same-origin checks do not apply; the bearer token does.
      security: [{ swarmIngest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwarmReport" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { type: object, properties: { ok: { const: true } } } } } }
        "400": { description: Malformed report; the body names the field, content: { application/json: {} } }
        "401": { description: Missing or wrong bearer token, content: { application/json: {} } }
        "503": { description: SWARM_INGEST_TOKEN is not set on the Worker, content: { application/json: {} } }
  /join:
    get:
      summary: Sign-up page with Continue with GitHub (or a not-yet-open note while the OAuth App is unset); signed in, the questionnaire or Overview
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
  /auth/github:
    get:
      summary: Starts GitHub OAuth with a signed state cookie
      responses:
        "302": { description: To github.com/login/oauth/authorize (the only off-site hop) }
        "503": { description: GitHub sign-in not configured (no OAuth App client ID/secret), content: { text/html: {} } }
  /auth/github/callback:
    get:
      summary: GitHub OAuth callback; checks state, sets the session, renders the questionnaire or Overview
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "400": { description: State mismatch or missing code; join page with the error, content: { text/html: {} } }
        "502": { description: GitHub token exchange or profile fetch failed, content: { text/html: {} } }
        "503": { description: GitHub sign-in not configured, content: { text/html: {} } }
  /console:
    get:
      summary: "Workspace: Overview (verified compute, declared nodes, Run 0 assignment, waitlist place, own status history, starter issues matched to the answers)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/nodes:
    get:
      summary: "Workspace: Compute Nodes (declared hardware; ?device=<kind> selects one)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/contributions:
    get:
      summary: "Workspace: Contributions (compute history, declared hardware mix, signed receipts)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/runs:
    get:
      summary: "Workspace: Training Runs (program phases, Run 0 readiness, all runs)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/models:
    get:
      summary: "Workspace: Model Registry (?tab=datasets lists the pinned dataset manifests)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /admin:
    get:
      summary: Operator Console: Operations (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/training:
    get:
      summary: Operator Console: Training (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/network:
    get:
      summary: Operator Console: Network (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/security:
    get:
      summary: Operator Console: Security (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/review:
    get:
      summary: Operator Console: Review Queue (search, filters, counts)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/review.csv:
    get:
      summary: Review Queue CSV export with the same filters
      responses:
        "200": { description: CSV attachment, content: { text/csv: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/review/{id}:
    get:
      summary: Sign-up detail with status buttons
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/audit:
    get:
      summary: Operator Console: Audit (status changes, who and when)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /join/questionnaire:
    get:
      summary: Questionnaire (first time)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
    post:
      summary: Save questionnaire answers
      requestBody: { content: { application/x-www-form-urlencoded: {} } }
      responses:
        "200": { description: Overview with a thank-you plus the Discord invite and matched starter issues, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
        "422": { description: Validation errors, form re-rendered, content: { text/html: {} } }
  /console/profile:
    get:
      summary: "Workspace: Settings (answers and edit form)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
    post:
      summary: Save edited answers
      requestBody: { content: { application/x-www-form-urlencoded: {} } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
        "422": { description: Validation errors, form re-rendered, content: { text/html: {} } }
  /admin/review/{id}/status:
    post:
      summary: Change a sign-up's status (form field status: waitlisted, invited, active, rejected); audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /logout:
    post:
      summary: Clear the session
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
  /__sentry-test:
    get:
      summary: Inert Sentry error probe; returns normal 404 unless GET x-sentry-test header matches SENTRY_TEST_KEY
      responses:
        "404": { description: Normal 404 page when x-sentry-test header is absent or wrong, content: { text/html: {} } }
        "500": { description: Throws Error("ofl sentry test") captured by Sentry when authorized }
components:
  securitySchemes:
    swarmIngest: { type: http, scheme: bearer, description: "Worker secret SWARM_INGEST_TOKEN" }
  schemas:
    SwarmNodeReport:
      type: object
      required: [id, hostname, device, gpu, memory_gib, torch]
      properties:
        id: { type: string, description: "hostname-device, e.g. adreno-legion-cuda" }
        github: { type: string, description: "GitHub login the node is attributed to; a report without it keeps the stored one" }
        hostname: { type: string }
        device: { type: string, description: "cuda, mps or cpu" }
        gpu: { type: string }
        memory_gib: { type: number }
        torch: { type: string }
        first_seen: { type: integer, description: "Unix ms; default now; the earliest value is kept" }
        last_heartbeat: { type: integer, description: "Unix ms; default now; never moves backwards" }
    SwarmRunReport:
      type: object
      required: [id, model, params, rounds, status]
      properties:
        id: { type: string }
        model: { type: string }
        params: { type: integer }
        rounds: { type: integer, description: "Rounds planned" }
        status: { enum: [waiting, training, done] }
        started_at: { type: integer }
        ended_at: { type: integer }
        weights_hash: { type: string }
        git_sha: { type: string }
        initial_val_loss: { type: number }
        wall_seconds: { type: number }
        nodes: { type: array, maxItems: 16, items: { type: string }, description: "Ids of the participating nodes" }
    SwarmRoundReport:
      type: object
      required: [run_id, round, val_loss, hashes_agree, elapsed, nodes]
      properties:
        run_id: { type: string }
        round: { type: integer }
        val_loss: { type: number }
        hashes_agree: { type: boolean }
        elapsed: { type: number }
        at: { type: integer, description: "Unix ms; default now" }
        nodes:
          type: array
          maxItems: 16
          items:
            type: object
            required: [node_id, train_loss, seconds]
            properties: { node_id: { type: string }, train_loss: { type: number }, seconds: { type: number } }
    SwarmReport:
      type: object
      properties:
        nodes: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/SwarmNodeReport" } }
        run: { $ref: "#/components/schemas/SwarmRunReport" }
        rounds: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/SwarmRoundReport" } }
    SwarmSummary:
      type: object
      required: [generated_at, online_window_seconds, totals, devices, nodes, latest_run]
      properties:
        generated_at: { type: integer }
        online_window_seconds: { type: integer }
        totals:
          type: object
          properties: { nodes_online: { type: integer }, nodes_registered: { type: integer }, runs: { type: integer }, rounds: { type: integer }, compute_seconds: { type: number } }
        devices:
          type: array
          items: { type: object, properties: { device: { type: string }, registered: { type: integer }, online: { type: integer } } }
        nodes:
          type: array
          description: Each node with online, compute_seconds and rounds
          items: { type: object }
        latest_run:
          type: [object, "null"]
          description: The run record plus state (training with nobody online reads stalled), rounds_done, hashes_agree_all, participants and log (per round val_loss, hashes_agree, elapsed, at and per-node train_loss and seconds)
