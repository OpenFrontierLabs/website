openapi: 3.1.1
info:
  title: Open Frontier Labs website
  version: 0.1.0
  description: >-
    Browser routes served by the Worker (server-rendered HTML forms, no JSON API). Session is a
    signed HttpOnly cookie set by the GitHub OAuth callback; POSTs must be same-origin (Sec-Fetch-Site: same-origin, or this site's Origin when that header is absent).
    Pages, not a programmatic API, so paths are unversioned (declared in api-schema-gate.json).
servers:
  - url: https://openfrontier-labs.com
paths:
  /:
    get:
      summary: Home page (static asset) with the live waitlist count
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
  /join:
    get:
      summary: Sign-up page with Continue with GitHub (or a not-yet-open note while the OAuth App is unset); signed in, the questionnaire or Overview
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
  /auth/github:
    get:
      summary: Starts GitHub OAuth with a signed state cookie
      responses:
        "302": { description: To github.com/login/oauth/authorize (the only off-site hop) }
        "503": { description: GitHub sign-in not configured (no OAuth App client ID/secret), content: { text/html: {} } }
  /auth/github/callback:
    get:
      summary: GitHub OAuth callback; checks state, sets the session, renders the questionnaire or Overview
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "400": { description: State mismatch or missing code; join page with the error, content: { text/html: {} } }
        "502": { description: GitHub token exchange or profile fetch failed, content: { text/html: {} } }
        "503": { description: GitHub sign-in not configured, content: { text/html: {} } }
  /console:
    get:
      summary: "Workspace: Overview (verified compute, declared nodes, Run 0 assignment, waitlist place, own status history)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/nodes:
    get:
      summary: "Workspace: Compute Nodes (declared hardware; ?device=<kind> selects one)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/contributions:
    get:
      summary: "Workspace: Contributions (compute history, declared hardware mix, signed receipts)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/runs:
    get:
      summary: "Workspace: Training Runs (program phases, Run 0 readiness, all runs)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /console/models:
    get:
      summary: "Workspace: Model Registry (?tab=datasets lists the pinned dataset manifests)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
  /admin:
    get:
      summary: Operator Console: Operations (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/training:
    get:
      summary: Operator Console: Training (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/network:
    get:
      summary: Operator Console: Network (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/security:
    get:
      summary: Operator Console: Security (planned)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/review:
    get:
      summary: Operator Console: Review Queue (search, filters, counts)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/review.csv:
    get:
      summary: Review Queue CSV export with the same filters
      responses:
        "200": { description: CSV attachment, content: { text/csv: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/review/{id}:
    get:
      summary: Sign-up detail with status buttons
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /admin/audit:
    get:
      summary: Operator Console: Audit (status changes, who and when)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /join/questionnaire:
    get:
      summary: Questionnaire (first time)
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
    post:
      summary: Save questionnaire answers
      requestBody: { content: { application/x-www-form-urlencoded: {} } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
        "422": { description: Validation errors, form re-rendered, content: { text/html: {} } }
  /console/profile:
    get:
      summary: "Workspace: Settings (answers and edit form)"
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
    post:
      summary: Save edited answers
      requestBody: { content: { application/x-www-form-urlencoded: {} } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "401": { description: No session; join page, content: { text/html: {} } }
        "422": { description: Validation errors, form re-rendered, content: { text/html: {} } }
  /admin/review/{id}/status:
    post:
      summary: Change a sign-up's status (form field status: waitlisted, invited, active, rejected); audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "403": { description: No session or not an operator, content: { text/html: {} } }
  /logout:
    post:
      summary: Clear the session
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
